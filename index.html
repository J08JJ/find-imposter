<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>추리 게임 - 범인을 찾아라!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage" data-title="골목 강도 살인 사건" data-time="21시 10분경" data-place="옥포시장 뒷 골목">
    <div class="victim" data-name="김철수" data-gender="남성" data-age="42"></div>
    <ul class="evidences">
      <li data-title="CCTV 영상 캡처" data-info="9시35분경 한 여성이 뒷골목을 빠져나옴."></li>
      <li data-title="피해자의 마지막 문자" data-info="김철수:'야 9시에 맥주나 마시게 잠깐 나와'"></li>
      <li data-title="혈흔이 묻은 장갑" data-info="골목 구석 쓰레기통에서 혈흔이 묻은 장갑 발견."></li>
    </ul>
    <div class="suspects">
      <div class="suspect" data-name="김철수" data-gender="남성" data-age="42" data-job="회사원" data-statement="맥주만 마시고 9시30분쯤 골목으로 가는 것까지 보고 집으로 귀가했습니다." data-action="다소 침착하지만 시선을 피함"></div>
      <div class="suspect" data-name="박영희" data-gender="여성" data-age="38" data-job="상인" data-statement="저는 9시에 마감하고 바로 집에 귀가했어요." data-action="대답이 빠르고 다소 불안한 표정"></div>
      <div class="suspect" data-name="김희수" data-gender="남성" data-age="29" data-job="직장인" data-statement="야근하고 골목길 지나는데 어떤 남자가 비틀거리면서 가더라고요." data-action="말을 천천히 하며 손을 꼼지락거림"></div>
    </div>
    <div class="culprit" data-name="박영희"></div>
  </div>

  <div class="stage" data-title="도서관 도난 사건" data-time="14시경" data-place="아주시립도서관">
    <div class="victim" data-name="도서관" data-gender="기관" data-age="-"></div>
    <ul class="evidences">
      <li data-title="CCTV 기록" data-info="직원은 카운터에서만 근무, 2시경 한 여성 출입."></li>
      <li data-title="카드 출입 기록" data-info="2시경 출입: 최한성"></li>
      <li data-title="증언" data-info="한지민: '2시에 한성이랑 과제하고 있었어요.'"></li>
    </ul>
    <div class="suspects">
      <div class="suspect" data-name="최한성" data-gender="남성" data-age="25" data-job="대학생" data-statement="저는 그때 지민이랑 과제하고 있었어요." data-action="진지하게 또박또박 말함"></div>
      <div class="suspect" data-name="정우성" data-gender="남성" data-age="40" data-job="도서관 직원" data-statement="저는 카운터에서만 앉아 있었어요." data-action="차분하게 설명"></div>
      <div class="suspect" data-name="최가영" data-gender="여성" data-age="23" data-job="대학생" data-statement="카드를 잃어버려서 도서관에 못 들어가요." data-action="말을 얼버무림"></div>
    </div>
    <div class="culprit" data-name="최가영"></div>
  </div>

  <div class="stage" data-title="거제도 유괴 사건" data-time="13시 30분경" data-place="모교 앞">
    <div class="victim" data-name="최유성" data-gender="여" data-age="8"></div>
    <ul class="evidences">
      <li data-title="현장 증거" data-info="아이의 머리핀 발견."></li>
      <li data-title="CCTV 영상" data-info="학교 앞에 오래 세워진 검은 봉고차."></li>
      <li data-title="목격자 증언" data-info="목격자: 아이가 아빠를 기다리다 누군가와 함께 가더라고요."></li>
    </ul>
    <div class="suspects">
      <div class="suspect" data-name="김세빈" data-gender="여성" data-age="30" data-job="교사" data-statement="아이들 하교하는 걸 보고 바로 학교로 들어갔어요." data-action="침착함"></div>
      <div class="suspect" data-name="황민수" data-gender="남성" data-age="45" data-job="경비원" data-statement="저는 청소하고 있었어요." data-action="자연스럽게 말함"></div>
      <div class="suspect" data-name="박민철" data-gender="남성" data-age="37" data-job="문구점 운영" data-statement="아이를 보긴 했지만 바빠서 그 뒤로는 못 봤어요." data-action="손을 바쁘게 움직임"></div>
      <div class="suspect" data-name="이정호" data-gender="남성" data-age="42" data-job="녹색어머니회 아버지" data-statement="아이가 아빠를 기다린다길래 단지 같이 서 있어줬을 뿐이에요." data-action="눈을 자꾸 피함"></div>
    </div>
    <div class="culprit" data-name="이정호"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
